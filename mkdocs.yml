site_name: A complete 16S processing workflow using Snakemake
site_url: https://pankajchejara23.github.io/16S-workflow
repo_url: https://github.com/pankajchejara23/16S-workflow
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.path
    - navigation.footer
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode


    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
nav:
  - Home: index.md
  - Setup: setup.md
  - Dataset: dataset.md
  - Workflow:
    - workflow/index.md
    - Configuration: workflow/config.md
    - Load config: workflow/load_config.md
    - Quality check: workflow/quality_check.md
    - Trimmomatic: workflow/trimmomatic.md
    - Qiime2 import: workflow/load_qiime.md
    - Adapters removal: workflow/adapters.md
    - Denoising & ASV: workflow/denoise-asv.md
    - Taxonomy generation: workflow/taxonomy.md
    - Diversity metrics: workflow/diversity_metrics.md
    - Relative abundance table: workflow/relative_abundance.md
  - Testing: testing.md
  - Execution: execution.md

extra:
  social:
    - icon: fontawesome/brands/linkedin 
      link: https://www.linkedin.com/in/pankaj-chejara-5ab77855/
    - icon: fontawesome/brands/github
      link: https://github.com/pankajchejara23

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
        # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets


plugins:
    - search
    - mermaid2
    - social
    - glightbox